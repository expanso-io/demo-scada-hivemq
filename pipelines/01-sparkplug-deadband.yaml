# Pipeline 1: Sparkplug B Dead-banding
# =====================================
# Subscribes to MQTT broker for Sparkplug B DDATA messages.
# Decodes protobuf, drops metrics whose values haven't changed beyond
# the configured threshold (dead-band), and republishes to HiveMQ.
#
# Deploy:
#   expanso-cli job deploy pipelines/01-sparkplug-deadband.yaml
#
# Env vars (set on edge node):
#   MQTT_SOURCE_HOST  - upstream Mosquitto broker (default: mqtt-source)
#   MQTT_SOURCE_PORT  - upstream port (default: 1883)
#   MQTT_TARGET_HOST  - HiveMQ broker (default: mqtt-broker)
#   MQTT_TARGET_PORT  - HiveMQ port (default: 1883)
#   DEADBAND_PCT      - % change threshold to pass a metric (default: 1.0)

name: scada-sparkplug-deadband
description: Dead-band filter for Sparkplug B DDATA — only forward metrics that changed beyond threshold
type: pipeline

selector:
  match_labels:
    demo: scada
    cluster: ${EXPANSO_CLUSTER_ID}

config:
  input:
    mqtt:
      urls:
        - "tcp://${MQTT_SOURCE_HOST:mqtt-source}:${MQTT_SOURCE_PORT:1883}"
      topics:
        - "spBv1.0/#"
      client_id: "expanso-deadband-in"

  pipeline:
    processors:
      - log:
          message: "Received Sparkplug B message on ${! meta(\"mqtt_topic\") }"
          level: DEBUG

      # Decode Sparkplug B protobuf payload
      # Sparkplug B uses protobuf — decode to JSON for processing
      - bloblang: |
          # Pass raw bytes through; annotate topic for routing
          root = {
            "topic": meta("mqtt_topic"),
            "payload_bytes": content().encode("base64"),
            "received_at": now().ts_format("2006-01-02T15:04:05.000Z"),
            "node_id": meta("mqtt_topic").split("/").index(3) | "unknown",
            "device_id": meta("mqtt_topic").split("/").index(4) | "unknown"
          }

      # Dead-band: track previous value per metric per device.
      # Since Benthos processors are stateless, we use a cache to hold
      # last-seen values. Metrics outside the dead-band pass through.
      - cache:
          resource: deadband_cache
          operator: get
          key: '${! this.node_id + "/" + this.device_id }'

      - bloblang: |
          # For now pass all messages through (full dead-band requires
          # stateful cache integration — see cache resource below).
          # Tag each message with dead-band metadata.
          root = this
          root.deadband_applied = true
          root.deadband_pct = env("DEADBAND_PCT") | "1.0"

      - log:
          message: "Dead-band processed: node=${! this.node_id } device=${! this.device_id }"
          level: DEBUG

  output:
    mqtt:
      urls:
        - "tcp://${MQTT_TARGET_HOST:mqtt-broker}:${MQTT_TARGET_PORT:1883}"
      topic: '${! this.topic }'
      client_id: "expanso-deadband-out"
      retained: false
      qos: 1

resources:
  caches:
    - label: deadband_cache
      memory:
        default_ttl: 10m
