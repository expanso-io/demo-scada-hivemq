services:
  # HiveMQ Community Edition (MQTT broker + websocket for dashboard)
  mqtt-broker:
    image: hivemq/hivemq-ce:latest
    container_name: mqtt-broker
    volumes:
      - ./hivemq/config.xml:/opt/hivemq/conf/config.xml:ro
    ports:
      - "8001:8000"    # websocket for browser dashboard (8001 to avoid conflicts)
      - "1883:1883"    # MQTT for scada-sim and local testing
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1883'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # SCADA simulator — generates telemetry for 4 industrial sites
  scada-sim:
    build: ./scada-sim
    container_name: scada-sim
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - PUBLISH_INTERVAL=0.33
    depends_on:
      mqtt-broker:
        condition: service_healthy

  # Dashboard (nginx serving static HTML)
  dashboard:
    image: nginx:1.27-alpine
    container_name: dashboard
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8888:80"
    depends_on:
      - mqtt-broker
