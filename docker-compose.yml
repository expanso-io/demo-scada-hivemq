name: demo-scada-hivemq

services:
  auth-init:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/init-auth.sh"]
    volumes:
      - demo-secrets:/run/demo-secrets
      - ./scripts/init-auth.sh:/scripts/init-auth.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  tls-init:
    image: hivemq/hivemq-ce:2025.5@sha256:7ae39e84654a41ced6e946dd84f131d508bc2b862ec96265b7f23d241db214da
    user: "0:0"
    entrypoint: ["/bin/bash", "/scripts/init-tls.sh"]
    volumes:
      - hivemq-tls:/run/hivemq-tls
      - ./scripts/init-tls.sh:/scripts/init-tls.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  mqtt-source:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    user: "1883:1883"
    entrypoint:
      - /usr/sbin/mosquitto
      - -c
      - /mosquitto/config/mosquitto.conf
    depends_on:
      auth-init:
        condition: service_completed_successfully
    volumes:
      - ./mqtt-source/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - demo-secrets:/run/demo-secrets:ro
      - mqtt-source-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_pub -h 127.0.0.1 -u source-publisher
          -P "$$(cat /run/demo-secrets/source-password)"
          -t health/source -m ready -q 1
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data-plane]

  mqtt-broker:
    build:
      context: .
      dockerfile: hivemq/Dockerfile
    depends_on:
      auth-init:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    volumes:
      - ./hivemq/config.xml:/opt/hivemq/conf/config.xml:ro
      - demo-secrets:/run/demo-secrets:ro
      - hivemq-tls:/run/hivemq-tls:ro
      - hivemq-data:/opt/hivemq/data
      - hivemq-log:/opt/hivemq/log
    ports:
      - "8883:8883"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo >/dev/tcp/127.0.0.1/8883'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data-plane]

  expanso-edge:
    image: ghcr.io/expanso-io/expanso-edge:v2.1.21@sha256:2a9ec67c90075b0bf33811232971cd4ee03326181ed4186c799986cf9d371b38
    depends_on:
      mqtt-source:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/run-local-edge.sh"]
    environment:
      SOURCE_MQTT_USER: source-publisher
      HIVEMQ_USER: expanso-edge
    volumes:
      - ./scripts/run-local-edge.sh:/scripts/run-local-edge.sh:ro
      - ./sparkplug_b.proto:/schemas/sparkplug_b.proto:ro
      - demo-secrets:/run/demo-secrets:ro
      - hivemq-tls:/run/hivemq-tls:ro
      - expanso-data:/var/lib/expanso
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data-plane]

  pipeline-loader:
    image: ghcr.io/expanso-io/expanso-cli:v2.1.21@sha256:d46fc6f21bbb1e53df800b2f89bca6a20b9cb116984fec336a47f7490161189d
    depends_on:
      expanso-edge:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/deploy-local-pipeline.sh"]
    volumes:
      - ./pipelines/scada-hivemq.yaml:/pipelines/scada-hivemq.yaml:ro
      - ./scripts/deploy-local-pipeline.sh:/scripts/deploy-local-pipeline.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data-plane]
    restart: "no"

  scada-sim:
    build:
      context: .
      dockerfile: scada-sim/Dockerfile
    depends_on:
      pipeline-loader:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/run-scada-sim.sh"]
    environment:
      MQTT_HOST: mqtt-source
      MQTT_PORT: "1883"
      MQTT_USER: source-publisher
      SPARKPLUG_TOPIC: spBv1.0/Expanso/DDATA/edge1/sensors
      UPDATE_INTERVAL_SEC: "0.25"
    volumes:
      - ./scripts/run-scada-sim.sh:/scripts/run-scada-sim.sh:ro
      - demo-secrets:/run/demo-secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [data-plane]

  dashboard:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      pipeline-loader:
        condition: service_completed_successfully
    volumes:
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/fonts:/usr/share/nginx/html/fonts:ro
      - ./fixtures:/usr/share/nginx/html/fixtures:ro
      - ./pipelines:/usr/share/nginx/html/pipelines:ro
    ports:
      - "8888:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0775
      - /var/run:size=4m,mode=0775
      - /tmp:size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [presentation]

volumes:
  demo-secrets:
  expanso-data:
  hivemq-data:
  hivemq-log:
  hivemq-tls:
  mqtt-source-data:

networks:
  data-plane:
    internal: true
  presentation:
